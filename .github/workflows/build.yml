# Builds Lumen for Windows.
#
# Every push and pull request gets a build, so a broken commit is obvious. Pushing a tag like
# v0.1.0 also puts the zip, the installer and the portable exe on a GitHub release.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check and build the UI
        run: npm run build
      - name: Package for Windows
        run: npx electron-builder --win nsis portable --publish never
      - name: Zip the unpacked app
        run: |
          Copy-Item build/READ-ME-FIRST.txt "release/win-unpacked/READ ME FIRST.txt"
          New-Item -ItemType Directory -Path release/Lumen -Force | Out-Null
          Copy-Item release/win-unpacked/* release/Lumen -Recurse -Force
          Compress-Archive -Path release/Lumen -DestinationPath release/Lumen-win.zip -Force
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: |
            release/Lumen-win.zip
            release/*.exe
      # A tag like v0.1.0 is all it takes: the notes come from RELEASE-NOTES.md in the repo, so
      # there is nothing to type into the release page.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lumen ${{ github.ref_name }}
          body_path: RELEASE-NOTES.md
          files: |
            release/Lumen-win.zip
            release/*.exe
